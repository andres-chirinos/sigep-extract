services:
  sigep-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigep-scraper
    restart: unless-stopped
    ports:
      # Puerto para ver e interactuar con el navegador web en tiempo real
      - "6080:6080"
    environment:
      - DISPLAY=:99
      - RESOLUTION=1600x1000x24
      - OUTPUT_FILE=/app/data/sigep_export.jsonl
      - DELAY_BETWEEN_PAGES=1800
      # Configuración S3 (AWS S3, Cloudflare R2, MinIO, Wasabi, etc.)
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX:-sigep/}
      - S3_SYNC_INTERVAL=${S3_SYNC_INTERVAL:-500}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
    volumes:
      - ./data:/app/data
      - ./server_scraper.js:/app/server_scraper.js:ro
      - ./s3_sync.js:/app/s3_sync.js:ro
      - ./entrypoint.sh:/app/entrypoint.sh:ro
    shm_size: '2gb'
