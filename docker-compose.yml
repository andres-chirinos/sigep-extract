services:
  sigep-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigep-scraper
    restart: unless-stopped
    ports:
      # Puerto para ver e interactuar con el navegador web en tiempo real
      - "6080:6080"
    environment:
      - DISPLAY=:99
      - RESOLUTION=1600x1000x24
      - OUTPUT_FILE=/app/data/sigep_export.jsonl
      - DELAY_BETWEEN_PAGES=1800
      # Configuración de rango y muestreo (opcional, si se dejan vacíos pregunta al iniciar)
      - START_PAGE=${START_PAGE:-}
      - END_PAGE=${END_PAGE:-}
      - PAGE_STEP=${PAGE_STEP:-1}
      - SAMPLE_SIZE=${SAMPLE_SIZE:-0}
    volumes:
      - ./data:/app/data
      - ./server_scraper.js:/app/server_scraper.js:ro
      - ./sampling.js:/app/sampling.js:ro
      - ./entrypoint.sh:/app/entrypoint.sh:ro
    shm_size: '2gb'
